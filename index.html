html,body{

/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

  dpr=Math.min(window.devicePixelRatio||1,2);

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  groundY=H-105;

  if(!running){
    player.x=W*.23;
    player.y=groundY-player.h;
  }
}

/* =========================================================
   DRAW HELPERS
   ========================================================= */

function rr(x,y,w,h,r){

  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function background(){

  let g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#74c9ff");
  g.addColorStop(.55,"#b7e7ff");
  g.addColorStop(.56,"#79bd55");
  g.addColorStop(1,"#39752f");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);


  ctx.fillStyle="#6da36d";

  ctx.beginPath();

  ctx.moveTo(0,groundY-80);
  ctx.lineTo(W*.2,groundY-210);
  ctx.lineTo(W*.42,groundY-80);
  ctx.lineTo(W*.65,groundY-190);
  ctx.lineTo(W,groundY-70);
  ctx.lineTo(W,groundY);
  ctx.lineTo(0,groundY);

  ctx.fill();


  let off=(performance.now()/1000*speed*.08)%120;

  for(let x=-120-off;x<W+120;x+=120){

    tree(x,groundY-10,1);
    tree(x+55,groundY-5,.72);

  }


  ctx.fillStyle="#2d6b2a";

  ctx.fillRect(
    0,
    groundY,
    W,
    H-groundY
  );


  ctx.strokeStyle="#4f9138";
  ctx.lineWidth=3;

  for(let x=0;x<W;x+=18){

    ctx.beginPath();

    ctx.moveTo(x,groundY+2);
    ctx.lineTo(x+5,groundY-8);

    ctx.moveTo(x+8,groundY+3);
    ctx.lineTo(x+14,groundY-7);

    ctx.stroke();

  }
}


/* =========================================================
   TREE
   ========================================================= */

function tree(x,y,s){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.fillStyle="#5b3924";
  ctx.fillRect(-10,-145,20,145);

  ctx.fillStyle="#174f25";

  [
    [0,-155,48],
    [35,-125,40],
    [-35,-125,40],
    [0,-105,55]
  ].forEach(a=>{

    ctx.beginPath();
    ctx.arc(
      a[0],
      a[1],
      a[2],
      0,
      Math.PI*2
    );
    ctx.fill();

  });

  ctx.restore();
}

  ctx.lineTo(x+10,y+69);

  );

  );

  );

/* =========================================================
   OBSTACLE DRAW
   ========================================================= */

function obstacleDraw(o){

  ctx.save();

  ctx.translate(o.x,o.y);


  if(o.type==="log"){

    ctx.fillStyle="#70411f";

    rr(
      0,
      10,
      o.w,
      25,
      9
    );

    ctx.fill();


    ctx.fillStyle="#a96d37";

    ctx.beginPath();

    ctx.arc(
      8,
      22,
      12,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle="#4b2a16";
    ctx.lineWidth=3;

    ctx.stroke();


  }else if(o.type==="rock"){

    ctx.fillStyle="#777";

    ctx.beginPath();

    ctx.moveTo(0,35);
    ctx.lineTo(8,10);
    ctx.lineTo(27,0);
    ctx.lineTo(45,14);
    ctx.lineTo(51,35);

    ctx.closePath();

    ctx.fill();


  }else if(o.type==="bush"){

    ctx.fillStyle="#1e6327";

    [
      [12,24,18],
      [29,15,21],
      [48,25,19]
    ].forEach(a=>{

      ctx.beginPath();

      ctx.arc(
        a[0],
        a[1],
        a[2],
        0,
        Math.PI*2
      );

      ctx.fill();

    });


  }else{

    ctx.fillStyle="#70411f";

    ctx.save();

    ctx.rotate(-.15);

    ctx.fillRect(
      0,
      14,
      o.w,
      24
    );

    ctx.restore();


    ctx.strokeStyle="#3d2515";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(18,34);
    ctx.lineTo(5,52);

    ctx.moveTo(43,34);
    ctx.lineTo(55,52);

    ctx.stroke();

  }

  ctx.restore();
}

/* =========================================================
   COLLISION
   ========================================================= */

function collide(a,b){

  return(

    a.x+6<b.x+b.w-5 &&

    a.x+a.w-6>b.x+5 &&

    a.y+8<b.y+b.h &&

    a.y+a.h-4>b.y+3

  );
}


/* =========================================================
   APPLE COLLECTION
   ========================================================= */

function collect(a){

  return(

    Math.hypot(

      player.x+player.w/2-a.x,

      player.y+player.h/2-a.y

    )<34

  );
}


/* =========================================================
   WEEK START
   ========================================================= */

function getWeekStart(){

  let d=new Date();

  let day=d.getDay();

  let diff=
    day===0
    ?-6
    :1-day;

  let monday=new Date(d);

  monday.setDate(
    d.getDate()+diff
  );

  return monday
    .toISOString()
    .slice(0,10);
}


/* =========================================================
   SAVE SCORE
   ONE NAME = ONE ENTRY
   HIGHEST SCORE ONLY
   ========================================================= */

async function saveScore(){

  try{

    const weekStart=getWeekStart();

    const res=await fetch(
      SUPABASE_URL+
      "/rest/v1/leaderboard?week_start=eq."+
      weekStart+
      "&select=id,name,score",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(!res.ok){
      console.log("Leaderboard read error:",await res.text());
      return;
    }

    const rows=await res.json();

    const samePlayer=rows.filter(
      x =>
        String(x.name).trim().toLowerCase() ===
        playerName.trim().toLowerCase()
    );

    /*
      Find this player's HIGHEST score
      from all their existing entries.
    */
    const highestExisting=samePlayer.length
      ? Math.max(...samePlayer.map(x=>Number(x.score)))
      : 0;

    /*
      If the new score isn't higher,
      don't change anything.
    */
    if(score<=highestExisting){
      return;
    }

    /*
      If this player already exists,
      update their highest existing entry.
    */
    if(samePlayer.length){

      const bestRow=samePlayer.reduce(
        (best,row)=>
          Number(row.score)>Number(best.score)
            ? row
            : best
      );

      const update=await fetch(
        SUPABASE_URL+
        "/rest/v1/leaderboard?id=eq."+
        bestRow.id,
        {
          method:"PATCH",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+SUPABASE_KEY,
            "Content-Type":"application/json",
            "Prefer":"return=minimal"
          },
          body:JSON.stringify({
            score:score
          })
        }
      );

      if(!update.ok){
        console.log(
          "Leaderboard update error:",
          await update.text()
        );
      }

      return;
    }

    /*
      No previous score for this player.
      Create their first entry.
    */
    const insert=await fetch(
      SUPABASE_URL+"/rest/v1/leaderboard",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          name:playerName,
          score:score,
          week_start:weekStart
        })
      }
    );

    if(!insert.ok){
      console.log(
        "Leaderboard insert error:",
        await insert.text()
      );
    }

  }catch(e){
    console.log("Leaderboard error:",e);
  }
}

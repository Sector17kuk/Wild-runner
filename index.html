/* =====================================================
   RESIZE
===================================================== */

function resize(){

  dpr=Math.min(
    window.devicePixelRatio || 1,
    2
  );

  W=canvas.clientWidth;

  H=canvas.clientHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  groundY=H-105;

  if(!running){

    player.x=W*.22;
    player.y=groundY-player.h;

  }

}

window.addEventListener(
  "resize",
  resize
);

/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

  const sky=
    ctx.createLinearGradient(
      0,0,0,H
    );

  sky.addColorStop(
    0,
    "#65c4f5"
  );

  sky.addColorStop(
    .55,
    "#b9e9ff"
  );

  sky.addColorStop(
    .56,
    "#7fc45a"
  );

  sky.addColorStop(
    1,
    "#37742d"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,W,H
  );


  /* distant hills */

  ctx.fillStyle="#60935e";

  ctx.beginPath();

  ctx.moveTo(0,groundY-70);

  ctx.lineTo(
    W*.20,
    groundY-190
  );

  ctx.lineTo(
    W*.42,
    groundY-70
  );

  ctx.lineTo(
    W*.67,
    groundY-180
  );

  ctx.lineTo(
    W,
    groundY-60
  );

  ctx.lineTo(W,groundY);

  ctx.lineTo(0,groundY);

  ctx.closePath();

  ctx.fill();


  /* ground */

  ctx.fillStyle="#2e7029";

  ctx.fillRect(
    0,
    groundY,
    W,
    H-groundY
  );


  /* grass */

  ctx.strokeStyle="#3f8835";

  ctx.lineWidth=2;

  for(
    let x=0;
    x<W;
    x+=18
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      groundY+8
    );

    ctx.lineTo(
      x+4,
      groundY-2
    );

    ctx.stroke();

  }

}


/* =====================================================
   RUNNER
   CLEARLY FACING RIGHT
===================================================== */

function drawPlayer(){

  const x=player.x;
  const y=player.y;


  /* back leg */

  ctx.strokeStyle="#263238";
  ctx.lineWidth=8;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(
    x+16,
    y+51
  );

  ctx.lineTo(
    x+7,
    y+68
  );

  ctx.stroke();


  /* front leg */

  ctx.beginPath();

  ctx.moveTo(
    x+28,
    y+51
  );

  ctx.lineTo(
    x+39,
    y+68
  );

  ctx.stroke();


  /* shoes */

  ctx.fillStyle="#111";

  ctx.fillRect(
    x,
    y+66,
    17,
    6
  );

  ctx.fillRect(
    x+34,
    y+66,
    17,
    6
  );


  /* body */

  ctx.fillStyle="#176b32";

  ctx.beginPath();

  ctx.roundRect(
    x+7,
    y+22,
    31,
    35,
    8
  );

  ctx.fill();


  /* back arm */

  ctx.strokeStyle="#f0b27a";

  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(
    x+10,
    y+29
  );

  ctx.lineTo(
    x-2,
    y+44
  );

  ctx.stroke();


  /* front arm */

  ctx.beginPath();

  ctx.moveTo(
    x+36,
    y+29
  );

  ctx.lineTo(
    x+49,
    y+40
  );

  ctx.stroke();


  /* head */

  ctx.fillStyle="#f0b27a";

  ctx.beginPath();

  ctx.arc(
    x+23,
    y+13,
    15,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  ctx.fillStyle="#24180f";

  ctx.beginPath();

  ctx.arc(
    x+23,
    y+8,
    15,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  /*
    EYE ON RIGHT SIDE
  */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    x+30,
    y+11,
    2.6,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    NOSE POINTS RIGHT
  */

  ctx.beginPath();

  ctx.moveTo(
    x+35,
    y+14
  );

  ctx.lineTo(
    x+43,
    y+18
  );

  ctx.lineTo(
    x+35,
    y+20
  );

  ctx.closePath();

  ctx.fill();


  /* smile */

  ctx.strokeStyle="#713a2b";

  ctx.lineWidth=1.5;

  ctx.beginPath();

  ctx.arc(
    x+34,
    y+19,
    5,
    0,
    Math.PI/2
  );

  ctx.stroke();

}


/* =====================================================
   OBSTACLES
===================================================== */

function drawObstacle(o){

  ctx.save();

  ctx.translate(
    o.x,
    o.y
  );


  if(o.type==="rock"){

    ctx.fillStyle="#777";

    ctx.beginPath();

    ctx.moveTo(0,35);

    ctx.lineTo(8,11);

    ctx.lineTo(27,0);

    ctx.lineTo(45,13);

    ctx.lineTo(52,35);

    ctx.closePath();

    ctx.fill();

  }

  else if(o.type==="bush"){

    ctx.fillStyle="#185d24";

    [
      [12,26,18],
      [30,15,21],
      [49,26,19]
    ].forEach(
      p=>{

        ctx.beginPath();

        ctx.arc(
          p[0],
          p[1],
          p[2],
          0,
          Math.PI*2
        );

        ctx.fill();

      }
    );

  }

  else if(o.type==="fallen"){

    ctx.fillStyle="#70411f";

    ctx.save();

    ctx.rotate(-.12);

    ctx.fillRect(
      0,
      12,
      68,
      25
    );

    ctx.restore();

  }

  else{

    ctx.fillStyle="#70411f";

    ctx.fillRect(
      0,
      10,
      65,
      25
    );

  }

  ctx.restore();

}


/* =====================================================
   APPLES
===================================================== */

function drawApple(a){

  ctx.fillStyle="#e52d2d";

  ctx.beginPath();

  ctx.arc(
    a.x,
    a.y,
    11,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#4d9c35";

  ctx.beginPath();

  ctx.ellipse(
    a.x+8,
    a.y-9,
    7,
    3,
    -.4,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =====================================================
   AUDIO
===================================================== */

function startAudio(){

  if(audioCtx)return;

  try{

    audioCtx=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    audioCtx.resume();

  }catch(e){}

}


function beep(
  frequency,
  duration
){

  if(!audioCtx)return;

  try{

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.frequency.value=
      frequency;

    osc.type="square";

    gain.gain.value=.06;

    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );

    osc.start();

    osc.stop(
      audioCtx.currentTime+
      duration
    );

  }catch(e){}

}

   JUMP

    !player.onGround

  player.vy=-700;

  player.onGround=false;

  beep(

/* =====================================================
   COLLISION
===================================================== */

function hit(a,b){

  return(
    a.x+7<
      b.x+b.w-5 &&

    a.x+a.w-7>
      b.x+5 &&

    a.y+8<
      b.y+b.h &&

    a.y+a.h-4>
      b.y+4
  );

}


function collect(a){

  return(
    Math.hypot(
      player.x+
      player.w/2-
      a.x,

      player.y+
      player.h/2-
      a.y
    )<34
  );

}


/* =====================================================
   WEEK START
===================================================== */

function getWeekStart(){

  const d=new Date();

  const day=d.getDay();

  const diff=
    day===0
    ?-6
    :1-day;

  const monday=
    new Date(d);

  monday.setDate(
    d.getDate()+diff
  );

  const year=
    monday.getFullYear();

  const month=
    String(
      monday.getMonth()+1
    ).padStart(2,"0");

  const date=
    String(
      monday.getDate()
    ).padStart(2,"0");

  return(
    year+
    "-"+
    month+
    "-"+
    date
  );

}


/* =====================================================
   SAVE SCORE
===================================================== */

async function saveScore(){

  try{

    if(
      !playerName ||
      score<=0
    ){
      return;
    }


    const week=
      getWeekStart();


    /*
      Read all scores from this week.
    */

    const response=
      await fetch(
        SUPABASE_URL+
        "/rest/v1/leaderboard"+
        "?week_start=eq."+
        encodeURIComponent(week)+
        "&select=id,name,score",
        {
          method:"GET",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer "+SUPABASE_KEY
          }
        }
      );


    if(!response.ok){

      console.log(
        "Score read failed:",
        await response.text()
      );

      return;

    }


    const rows=
      await response.json();


    const wanted=
      playerName
        .trim()
        .toLowerCase();


    /*
      Find this player's current
      highest score.
    */

    let oldBest=0;

    let bestRow=null;


    for(
      const row of rows
    ){

      if(
        String(row.name)
          .trim()
          .toLowerCase()
        ===wanted
      ){

        const old=
          Number(row.score)||0;

        if(old>oldBest){

          oldBest=old;

          bestRow=row;

        }

      }

    }


    /*
      LOWER score:
      do absolutely nothing.
    */

    if(score<=oldBest){

      return;

    }


    /*
      HIGHER score:
      update the existing row.
    */

    if(bestRow){

      const updateResponse=
        await fetch(
          SUPABASE_URL+
          "/rest/v1/leaderboard"+
          "?id=eq."+
          encodeURIComponent(
            bestRow.id
          ),
          {
            method:"PATCH",

            headers:{
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer "+
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify({
                score:score
              })
          }
        );


      if(!updateResponse.ok){

        console.log(
          "Score update failed:",
          await updateResponse.text()
        );

      }

    }

    /*
      FIRST score:
      create a row.
    */

    else{

      const insertResponse=
        await fetch(
          SUPABASE_URL+
          "/rest/v1/leaderboard",
          {
            method:"POST",

            headers:{
              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer "+
                SUPABASE_KEY,

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"
            },

            body:
              JSON.stringify({

                name:
                  playerName.trim(),

                score:
                  score,

                week_start:
                  week

              })
          }
        );


      if(!insertResponse.ok){

        console.log(
          "Score insert failed:",
          await insertResponse.text()
        );

      }

    }

  }
  catch(error){

    console.log(
      "Save score error:",
      error
    );

  }

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard(){

  try{

    const week=
      getWeekStart();


    const response=
      await fetch(
        SUPABASE_URL+
        "/rest/v1/leaderboard"+
        "?week_start=eq."+
        encodeURIComponent(week)+
        "&select=name,score"+
        "&limit=1000",
        {
          method:"GET",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              SUPABASE_KEY
          }
        }
      );


    if(!response.ok){

      leaderboardList.textContent=
        "Leaderboard unavailable";

      return;

    }


    const rows=
      await response.json();


    /*
      IMPORTANT:
      One player = one leaderboard entry.
      Highest score wins.
    */

    const players=
      new Map();


    for(
      const row of rows
    ){

      const name=
        String(row.name||"")
          .trim();

      if(!name)continue;


      const key=
        name.toLowerCase();


      const value=
        Number(row.score)||0;


      if(
        !players.has(key) ||
        value>
        players.get(key).score
      ){

        players.set(
          key,
          {
            name:name,
            score:value
          }
        );

      }

    }


    const top=
      Array.from(
        players.values()
      )
      .sort(
        (a,b)=>
          b.score-a.score
      )
      .slice(0,10);


    if(top.length===0){

      leaderboardList.textContent=
        "No scores yet";

      return;

    }


    leaderboardList.innerHTML=
      top.map(
        (p,i)=>
          `<div>${i+1}. ${escapeHTML(p.name)} — ${p.score}</div>`
      ).join("");

  }
  catch(error){

    console.log(
      "Leaderboard error:",
      error
    );

    leaderboardList.textContent=
      "Leaderboard unavailable";

  }

}


/* =====================================================
   SAFE NAME DISPLAY
===================================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   GAME OVER
===================================================== */

async function gameOver(){

  if(!running)return;

  running=false;

  finalScore.textContent=
    score;

  gameOverPanel
    .classList
    .remove("hidden");


  /*
    Save first, then refresh.
  */

  await saveScore();

  await loadLeaderboard();

}

      "wildRunnerName"
    );

      nameInput.value = playerName;
nameInput.readOnly = true;

    }

      entered;

      "wildRunnerName",

    loop
  );

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  speed+=
    dt*3;


  /*
    Gravity
  */

  player.vy+=
    1900*dt;

  player.y+=
    player.vy*dt;


  if(
    player.y>=
    groundY-player.h
  ){

    player.y=
      groundY-player.h;

    player.vy=0;

    player.onGround=true;

  }


  /*
    Obstacles
  */

  spawnTimer-=dt;


  if(spawnTimer<=0){

    spawnObstacle();

    spawnTimer=
      Math.max(
        .65,
        1.15-
        Math.min(score,50)*
        .008
      )+
      Math.random()*.4;

  }


  /*
    Apples
  */

  appleTimer-=dt;


  if(appleTimer<=0){

    spawnApple();

    appleTimer=
      .65+
      Math.random()*.6;

  }


  for(
    const o of obstacles
  ){

    o.x-=
      speed*dt;

  }


  for(
    const a of apples
  ){

    a.x-=
      speed*dt;

  }


  /*
    Obstacle collision
  */

  for(
    const o of obstacles
  ){

    if(
      hit(player,o)
    ){

      gameOver();

      return;

    }

  }


  /*
    Remove old obstacles
  */

  obstacles=
    obstacles.filter(
      o=>
        o.x+o.w>-60
    );


  /*
    Apples
  */

  for(
    let i=apples.length-1;
    i>=0;
    i--
  ){

    const a=
      apples[i];


    if(
      collect(a)
    ){

      score++;

      scoreEl.textContent=
        score;

      beep(
        900,
        .08
      );

      apples.splice(
        i,
        1
      );

    }
    else if(
      a.x<-30
    ){

      apples.splice(
        i,
        1
      );

    }

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  drawBackground();

  for(
    const a of apples
  ){

    drawApple(a);

  }


  for(
    const o of obstacles
  ){

    drawObstacle(o);

  }


  drawPlayer();

}


/* =====================================================
   MAIN LOOP
===================================================== */

function loop(time){

  if(!running)return;


  const dt=
    Math.min(
      (time-lastTime)/1000,
      .035
    );


  lastTime=time;


  update(dt);

  draw();


  if(running){

    requestAnimationFrame(
      loop
    );

  }

}


/* =====================================================
   SWIPE
===================================================== */

let touchStartX=0;
let touchStartY=0;


canvas.addEventListener(
  "touchstart",
  function(e){

    const t=
      e.changedTouches[0];

    touchStartX=
      t.clientX;

    touchStartY=
      t.clientY;

    e.preventDefault();

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  function(e){

    const t=
      e.changedTouches[0];

    const dx=
      Math.abs(
        t.clientX-
        touchStartX
      );

    const dy=
      touchStartY-
      t.clientY;


    if(
      dy>45 &&
      dy>dx*.7
    ){

      jump();

    }

    e.preventDefault();

  },
  {passive:false}
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.code==="ArrowUp" ||
      e.code==="Space"
    ){

      jump();

    }

  }
);


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  start
);


document.getElementById(
  "againBtn"
).addEventListener(
  "click",
  start
);


/* =====================================================
   REMEMBER NAME
===================================================== */

const savedName=
  localStorage.getItem(
    "wildRunnerName"
  );


if(savedName){

  playerName=savedName;

  nameInput.value=
    savedName;

  playerHud.textContent=
    savedName;

}


/* =====================================================
   INITIAL DRAW + LEADERBOARD
===================================================== */

draw();

loadLeaderboard();


/*
  Automatic leaderboard refresh:
  every 3 seconds.
*/

setInterval(
  loadLeaderboard,
  3000
);

document.getElementById("shareBtn").addEventListener("click", async function () {

  const finalScore =
    document.getElementById("finalScore").textContent;

  const shareText =
    "🏃 I scored " + finalScore +
    " in Wild Runner! 🔥\n\n" +
    "Can you beat my score?\n\n" +
    "🎮 Play Wild Runner:\n" +
    window.location.href;

  if (navigator.share) {

    try {

      await navigator.share({
        title: "Wild Runner",
        text: shareText
      });

    } catch (error) {
      // Player closed the share menu
    }

  } else {

    try {

      await navigator.clipboard.writeText(shareText);

      alert("Score copied! 🔥 Send it to your friends.");

    } catch (error) {

      alert(shareText);

    }

  }

});
</script>

function resize(){

    window.devicePixelRatio||1,
    2

  H=canvas.clientHeight;

  canvas.width=W*dpr;

/* =====================================================
   ROUNDED RECTANGLE
===================================================== */

function rr(
  x,
  y,
  w,
  h,
  r
){

  ctx.beginPath();

  ctx.roundRect(
    x,
    y,
    w,
    h,
    r
  );

}


/* =====================================================
   BACKGROUND
===================================================== */

function background(){

  let g=

    0,
    "#74c9ff"

  g.addColorStop(
    .56,
    "#79bd55"
  );

  g.addColorStop(
    1,

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.fillStyle="#6da36d";

  ctx.beginPath();

  ctx.moveTo(

    groundY-80

  ctx.lineTo(
    W,

    0,

  ctx.fillRect(
    0,
    groundY,
    W,
    H-groundY
  );

/* =====================================================
   TREE
===================================================== */

function tree(
  x,
  y,
  s
){

  ctx.save();

  ctx.translate(
    x,
    y
  );

  ctx.scale(
    s,
    s
  );

  ctx.fillStyle="#5b3924";

  ctx.fillRect(
    -10,
    -145,
    20,
    145
  );

  ctx.fillStyle="#174f25";

  [
    [0,-155,48],
    [35,-125,40],
    [-35,-125,40],
    [0,-105,55]
  ].forEach(a=>{

    ctx.beginPath();

    ctx.arc(
      a[0],
      a[1],
      a[2],
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.restore();

}

/* =====================================================
   OBSTACLES
===================================================== */

function obstacleDraw(o){

  ctx.save();

  ctx.translate(
    o.x,
    o.y
  );


  if(o.type==="log"){

    ctx.fillStyle="#70411f";

    rr(
      0,
      10,
      o.w,
      25,
      9
    );

    ctx.fill();

  else if(o.type==="rock"){

    ctx.fillStyle="#777";

    ctx.beginPath();

    ctx.moveTo(0,35);

    ctx.lineTo(8,10);

    ctx.lineTo(27,0);

    ctx.lineTo(45,14);

    ctx.lineTo(51,35);

    ctx.closePath();

    ctx.fill();

  }


  else if(o.type==="bush"){

    ctx.fillStyle="#1e6327";

    [
      [12,24,18],
      [29,15,21],

      );

  else{

    ctx.fillStyle="#70411f";

    ctx.save();

    ctx.rotate(-.15);

    ctx.fillRect(
      0,
      14,
      o.w,
      24
    );

    ctx.restore();

  }

  ctx.restore();

}

/* =====================================================
   SOUND
===================================================== */

function beep(
  frequency,
  duration,
  type,
  volume
){

  if(!audioCtx)return;

  try{

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=
      frequency;

    gain.gain.value=
      volume;

    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );

    osc.start();

    osc.stop(
      audioCtx.currentTime+
      duration
    );

  }catch(e){}

}


function audioStart(){

  if(audioCtx)return;

  try{

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    audioCtx.resume();

  }catch(e){}

}

/* =====================================================
   COLLISION
===================================================== */

function collide(a,b){

  return(
    a.x+6<
      b.x+b.w-5&&

    a.x+a.w-6>
      b.x+5&&

    a.y+8<
      b.y+b.h&&

    a.y+a.h-4>
      b.y+3
  );

}


function collect(a){

  return(
    Math.hypot(
      player.x+
        player.w/2-
        a.x,

      player.y+
        player.h/2-
        a.y
    )<34
  );

}


/* =====================================================
   WEEK
===================================================== */

function getWeekStart(){

  const d=
    new Date();

  const day=
    d.getDay();

  const diff=
    day===0
    ?-6
    :1-day;

  const monday=
    new Date(d);

  monday.setDate(
    d.getDate()+diff
  );

  const year=
    monday.getFullYear();

  const month=
    String(
      monday.getMonth()+1
    ).padStart(2,"0");

  const date=
    String(
      monday.getDate()
    ).padStart(2,"0");

  return(
    year+
    "-"+
    month+
    "-"+
    date
  );

}


/* =====================================================
   SAVE SCORE
===================================================== */

async function saveScore(){

  try{

    const weekStart=
      getWeekStart();


    /*
      Get ALL rows for this week.
      We don't search by exact name here,
      because old duplicate rows may exist.
    */

    const response=
      await fetch(
        SUPABASE_URL+
        "/rest/v1/leaderboard"+
        "?week_start=eq."+
        weekStart+
        "&select=id,name,score",
        {
          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              SUPABASE_KEY
          }
        }
      );


    const rows=
      await response.json();


    if(!response.ok){

      console.log(
        "Leaderboard read error:",
        rows
      );

      return;

    }


    const target=
      playerName
        .trim()
        .toLowerCase();


    /*
      Find EVERY row belonging
      to this player.
    */

    const mine=
      rows.filter(
        row=>
          row.name
            .trim()
            .toLowerCase()
          ===target
      );


    let highest=0;

    let highestRow=null;


    mine.forEach(row=>{

      const s=
        Number(row.score)||0;

      if(s>highest){

        highest=s;

        highestRow=row;

      }

    });


    /*
      If old score is already higher,
      don't change it.
    */

    if(highest>=score){

      loadLeaderboard();

      return;

    }


    /*
      If a row already exists,
      UPDATE the highest row.
    */

    if(highestRow){

      await fetch(
        SUPABASE_URL+
        "/rest/v1/leaderboard"+
        "?id=eq."+
        highestRow.id,
        {
          method:"PATCH",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify({
              score:score
            })
        }
      );

    }


    /*
      If the player has never scored
      this week, INSERT a new row.
    */

    else{

      await fetch(
        SUPABASE_URL+
        "/rest/v1/leaderboard",
        {
          method:"POST",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify({

              name:
                playerName.trim(),

              score:
                score,

              week_start:
                weekStart

            })
        }
      );

    }


    await loadLeaderboard();

  }

  catch(error){

    console.log(
      "Save score error:",
      error
    );

  }

}

/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard(){

  try{

    const weekStart=
      getWeekStart();


    const response=
      await fetch(
        SUPABASE_URL+
        "/rest/v1/leaderboard"+
        "?week_start=eq."+
        weekStart+
        "&select=name,score"+
        "&order=score.desc"+
        "&limit=100",
        {
          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+
              SUPABASE_KEY
          }
        }
      );


    const rows=
      await response.json();


    if(!response.ok){

      leaderboardList.textContent=
        "Leaderboard unavailable";

      console.log(
        "Leaderboard error:",
        rows
      );

      return;

    }


    /*
      Combine duplicate names.
      Each name gets ONE entry,
      with its highest score.
    */

    const bestByName={};


    rows.forEach(row=>{

      const cleanName=
        row.name
          .trim();

      const key=
        cleanName
          .toLowerCase();

      const current=
        Number(
          row.score
        )||0;


      if(
        !bestByName[key]||
        current>
        bestByName[key].score
      ){

        bestByName[key]={

          name:cleanName,

          score:current

        };

      }

    });


    /*
      Sort highest to lowest.
    */

    const top=
      Object.values(
        bestByName
      )
      .sort(
        (a,b)=>
          b.score-a.score
      )
      .slice(0,10);


    if(!top.length){

      leaderboardList.textContent=
        "No scores yet";

      return;

    }


    leaderboardList.innerHTML=
      top.map(
        (row,index)=>
          `<div>${index+1}. ${escapeHTML(row.name)} — ${row.score}</div>`
      ).join("");

  }

  catch(error){

    console.log(
      "Leaderboard error:",
      error
    );

    leaderboardList.textContent=
      "Leaderboard unavailable";

  }

}


/* =====================================================
   SECURITY FOR PLAYER NAMES
===================================================== */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   GAME UPDATE
===================================================== */

function update(dt){

  speed+=
    dt*4;


  player.vy+=
    1900*dt;

  player.y+=
    player.vy*dt;


  if(
    player.y>=
    groundY-player.h
  ){

    player.y=
      groundY-player.h;

    player.vy=0;

    player.onGround=true;

  }


  spawnTimer-=dt;

  appleTimer-=dt;


  if(spawnTimer<=0){

    spawnObstacle();

    spawnTimer=
      Math.max(
        .72,
        1.25-
        Math.min(
          score,
          40
        )*.012
      )+
      Math.random()*.35;

  }


  if(appleTimer<=0){

    spawnApple();

    appleTimer=
      .65+
      Math.random()*.7;

  }


  obstacles.forEach(
    o=>
      o.x-=speed*dt
  );


  apples.forEach(
    a=>
      a.x-=speed*dt
  );


  for(
    let i=
      obstacles.length-1;

    i>=0;

    i--
  ){

    if(
      obstacles[i].x+
      obstacles[i].w<
      -50
    ){

      obstacles.splice(
        i,
        1
      );

    }

    else if(
      collide(
        player,
        obstacles[i]
      )
    ){

      gameOver();

      return;

    }

  }


  for(
    let i=
      apples.length-1;

    i>=0;

    i--
  ){

    if(
      apples[i].x<
      -30
    ){

      apples.splice(
        i,
        1
      );

    }

    else if(
      collect(
        apples[i]
      )
    ){

      score++;

      scoreEl.textContent=
        score;

      beep(
        900,
        .08,
        "sine",
        .08
      );

      apples.splice(
        i,
        1
      );

    }

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  background();

  apples.forEach(
    appleDraw
  );

  obstacles.forEach(
    obstacleDraw
  );

  playerDraw();

}


/* =====================================================
   LOOP
===================================================== */

function loop(t){

  if(!running)return;


  const dt=
    Math.min(
      (t-last)/1000,
      .035
    );


  last=t;


  update(dt);

  draw();


  if(running){

    requestAnimationFrame(
      loop
    );

  }

}


/* =====================================================
   TOUCH
===================================================== */

let sy=0;
let sx=0;


canvas.addEventListener(
  "touchstart",
  e=>{

    const t=
      e.changedTouches[0];

    sy=t.clientY;

    sx=t.clientX;

    e.preventDefault();

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  e=>{

    const t=
      e.changedTouches[0];

    const dy=
      sy-t.clientY;

    const dx=
      Math.abs(
        t.clientX-sx
      );


    if(
      dy>45&&
      dy>dx*.7
    ){

      jump();

    }

    e.preventDefault();

  },
  {passive:false}
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="ArrowUp"||
      e.code==="Space"
    ){

      jump();

    }

  }
);


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
  "startBtn"
).onclick=start;


document.getElementById(
  "againBtn"
).onclick=start;


/* =====================================================
   LOAD SAVED NAME
===================================================== */

const savedName=
  localStorage.getItem(
    "wildRunnerName"
  );


if(savedName){

  playerName=
    savedName;

  nameInput.value=
    savedName;

}


/* =====================================================
   INITIAL LEADERBOARD
===================================================== */

loadLeaderboard();


/* =====================================================
   REFRESH LEADERBOARD EVERY 3 SECONDS
===================================================== */

setInterval(
  loadLeaderboard,
  3000
);

</script>

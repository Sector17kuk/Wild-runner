<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wild Runner</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

body{

  justify-content:center;

}

#game{

  height:100%;

}

canvas{

#hud{

  top:14px;
  left:14px;

  padding:14px;

button{

  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#176b32;
  color:white;
  font-size:19px;
  font-weight:800;
}

.small{
  font-size:14px;
  color:#666;
}

.hidden{
  display:none!important;
}

#hint{

  bottom:15px;
  left:0;
  right:0;
  text-align:center;
  color:white;
  font-weight:700;
  text-shadow:1px 1px 3px #000;
  pointer-events:none;
  z-index:4;
}

#leaderboard{
  position:absolute;
  top:10px;
  right:10px;

  overflow:auto;
  background:rgba(17,17,17,.9);

  padding:12px;
  border-radius:12px;
  font-family:Arial,sans-serif;

  font-size:14px;
}

#leaderboard b{
  display:block;
  margin-bottom:7px;
  font-size:15px;
}

#leaderboardList div{
  margin:4px 0;
}

</head>

<script>

/* =========================================================
   CANVAS
   ========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const startPanel=document.getElementById("startPanel");
const gameOverPanel=document.getElementById("gameOverPanel");
const nameInput=document.getElementById("nameInput");
const finalScore=document.getElementById("finalScore");

let W=0;
let H=0;
let dpr=1;

let running=false;
let score=0;
let last=0;

let spawnTimer=0;
let appleTimer=0;

let groundY=0;

let apples=[];

/* =========================================================
   PLAYER

const player={
  x:0,
  y:0,
  w:42,

};


/* =========================================================
   RESIZE
   ========================================================= */

function resize(){

  dpr=Math.min(window.devicePixelRatio||1,2);

  W=canvas.clientWidth;
  H=canvas.clientHeight;

  canvas.width=W*dpr;
  canvas.height=H*dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);

  groundY=H-105;

  if(!running){
    player.x=W*.23;
    player.y=groundY-player.h;
  }
}

window.addEventListener("resize",resize);

resize();


/* =========================================================
   DRAW HELPERS
   ========================================================= */

function rr(x,y,w,h,r){

  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function background(){

  let g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#74c9ff");
  g.addColorStop(.55,"#b7e7ff");
  g.addColorStop(.56,"#79bd55");
  g.addColorStop(1,"#39752f");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);


  ctx.fillStyle="#6da36d";

  ctx.beginPath();

  ctx.moveTo(0,groundY-80);
  ctx.lineTo(W*.2,groundY-210);
  ctx.lineTo(W*.42,groundY-80);
  ctx.lineTo(W*.65,groundY-190);
  ctx.lineTo(W,groundY-70);
  ctx.lineTo(W,groundY);
  ctx.lineTo(0,groundY);

  ctx.fill();


  let off=(performance.now()/1000*speed*.08)%120;

  for(let x=-120-off;x<W+120;x+=120){

    tree(x,groundY-10,1);
    tree(x+55,groundY-5,.72);

  }


  ctx.fillStyle="#2d6b2a";

  ctx.fillRect(
    0,
    groundY,
    W,
    H-groundY
  );


  ctx.strokeStyle="#4f9138";
  ctx.lineWidth=3;

  for(let x=0;x<W;x+=18){

    ctx.beginPath();

    ctx.moveTo(x,groundY+2);
    ctx.lineTo(x+5,groundY-8);

    ctx.moveTo(x+8,groundY+3);
    ctx.lineTo(x+14,groundY-7);

    ctx.stroke();

  }
}


/* =========================================================
   TREE
   ========================================================= */

function tree(x,y,s){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.fillStyle="#5b3924";
  ctx.fillRect(-10,-145,20,145);

  ctx.fillStyle="#174f25";

  [
    [0,-155,48],
    [35,-125,40],
    [-35,-125,40],
    [0,-105,55]
  ].forEach(a=>{

    ctx.beginPath();
    ctx.arc(
      a[0],
      a[1],
      a[2],
      0,
      Math.PI*2
    );
    ctx.fill();

  });

  ctx.restore();
}


/* =========================================================
   PLAYER DRAW
   ========================================================= */

function playerDraw(){

  let x=player.x;
  let y=player.y;


  ctx.strokeStyle="#263238";
  ctx.lineWidth=8;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(x+17,y+52);
  ctx.lineTo(x+10,y+69);

  ctx.moveTo(x+27,y+52);
  ctx.lineTo(x+36,y+69);

  ctx.stroke();


  ctx.fillStyle="#111";

  ctx.fillRect(
    x+3,
    y+66,
    15,
    6
  );

  ctx.fillRect(
    x+31,
    y+66,
    15,
    6
  );


  ctx.fillStyle="#176b32";

  rr(
    x+7,
    y+23,
    31,
    34,
    8
  );

  ctx.fill();


  ctx.strokeStyle="#f0b27a";
  ctx.lineWidth=7;

  ctx.beginPath();

  ctx.moveTo(x+9,y+28);
  ctx.lineTo(x-2,y+44);

  ctx.moveTo(x+36,y+29);
  ctx.lineTo(x+48,y+42);

  ctx.stroke();


  ctx.fillStyle="#f0b27a";

  ctx.beginPath();

  ctx.arc(
    x+23,
    y+13,
    15,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#24180f";

  ctx.beginPath();

  ctx.arc(
    x+23,
    y+5,
    15,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    x+28,
    y+12,
    2,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   OBSTACLE DRAW
   ========================================================= */

function obstacleDraw(o){

  ctx.save();

  ctx.translate(o.x,o.y);


  if(o.type==="log"){

    ctx.fillStyle="#70411f";

    rr(
      0,
      10,
      o.w,
      25,
      9
    );

    ctx.fill();


    ctx.fillStyle="#a96d37";

    ctx.beginPath();

    ctx.arc(
      8,
      22,
      12,
      0,
      Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle="#4b2a16";
    ctx.lineWidth=3;

    ctx.stroke();


  }else if(o.type==="rock"){

    ctx.fillStyle="#777";

    ctx.beginPath();

    ctx.moveTo(0,35);
    ctx.lineTo(8,10);
    ctx.lineTo(27,0);
    ctx.lineTo(45,14);
    ctx.lineTo(51,35);

    ctx.closePath();

    ctx.fill();


  }else if(o.type==="bush"){

    ctx.fillStyle="#1e6327";

    [
      [12,24,18],
      [29,15,21],
      [48,25,19]
    ].forEach(a=>{

      ctx.beginPath();

      ctx.arc(
        a[0],
        a[1],
        a[2],
        0,
        Math.PI*2
      );

      ctx.fill();

    });


  }else{

    ctx.fillStyle="#70411f";

    ctx.save();

    ctx.rotate(-.15);

    ctx.fillRect(
      0,
      14,
      o.w,
      24
    );

    ctx.restore();


    ctx.strokeStyle="#3d2515";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(18,34);
    ctx.lineTo(5,52);

    ctx.moveTo(43,34);
    ctx.lineTo(55,52);

    ctx.stroke();

  }

  ctx.restore();
}


/* =========================================================
   APPLE DRAW
   ========================================================= */

function appleDraw(a){

  ctx.fillStyle="#e52d2d";

  ctx.beginPath();

  ctx.arc(
    a.x,
    a.y,
    11,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#4a9b35";

  ctx.beginPath();

  ctx.ellipse(
    a.x+8,
    a.y-9,
    7,
    3,
    -.4,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle="#51351c";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.moveTo(a.x,a.y-8);
  ctx.lineTo(a.x+3,a.y-15);

  ctx.stroke();
}


/* =========================================================
   JUMP
   ========================================================= */

function jump(){

  if(!running || !player.onGround){
    return;
  }

  player.vy=-720;
  player.onGround=false;

  beep(
    520,
    .12,
    "square",

  );

  beep(
    760,
    .15,

/* =========================================================
   SPAWN OBSTACLE
   ========================================================= */

function spawnObstacle(){

  let types=[
    "log",
    "rock",
    "bush",
    "tree"
  ];

  let type=
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];


  let w=
    type==="tree"
    ?65
    :type==="bush"
    ?60
    :type==="rock"
    ?52
    :65;


  let h=
    type==="tree"
    ?52
    :type==="bush"
    ?42
    :type==="rock"
    ?35
    :35;


  obstacles.push({

    x:W+30,

    y:groundY-h,

    w:w,

    h:h,

    type:type

  });
}


/* =========================================================
   SPAWN APPLE
   ========================================================= */

function spawnApple(){

  apples.push({

    x:W+20,

    y:
      Math.random()<.45
      ?groundY-95-Math.random()*55
      :groundY-18,

    r:11

  });
}


/* =========================================================
   COLLISION
   ========================================================= */

function collide(a,b){

  return(

    a.x+6<b.x+b.w-5 &&

    a.x+a.w-6>b.x+5 &&

    a.y+8<b.y+b.h &&

    a.y+a.h-4>b.y+3

  );
}


/* =========================================================
   APPLE COLLECTION
   ========================================================= */

function collect(a){

  return(

    Math.hypot(

      player.x+player.w/2-a.x,

      player.y+player.h/2-a.y

    )<34

  );
}


/* =========================================================
   WEEK START
   ========================================================= */

function getWeekStart(){

  let d=new Date();

  let day=d.getDay();

  let diff=
    day===0
    ?-6
    :1-day;

  let monday=new Date(d);

  monday.setDate(
    d.getDate()+diff
  );

  return monday
    .toISOString()
    .slice(0,10);
}


/* =========================================================
   SAVE SCORE
   ONE NAME = ONE ENTRY
   HIGHEST SCORE ONLY
   ========================================================= */

async function saveScore(){

  try{

    let weekStart=getWeekStart();


    /*
      Get all scores for this week.
      We find the player's existing score
      in JavaScript so capitalization does
      not create duplicate names.
    */

    let check=await fetch(

      SUPABASE_URL+
      "/rest/v1/leaderboard?week_start=eq."+
      weekStart+
      "&select=id,name,score",

      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+SUPABASE_KEY
        }
      }

    );


    if(!check.ok){

      console.log(
        "Leaderboard check failed:",
        await check.text()
      );

      return;
    }


    let rows=await check.json();


    let existing=
      rows.find(
        x=>
          String(x.name).trim().toLowerCase()
          ===
          playerName.trim().toLowerCase()
      );


    /*
      If the player already has an equal
      or higher score, do nothing.
    */

    if(
      existing &&
      Number(existing.score)>=score
    ){

      return;
    }


    /*
      If the player already exists and has
      a lower score, update it.
    */

    if(existing){

      let update=await fetch(

        SUPABASE_URL+
        "/rest/v1/leaderboard?id=eq."+
        existing.id,

        {

          method:"PATCH",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer "+SUPABASE_KEY,
            "Content-Type":
              "application/json",
            "Prefer":
              "return=minimal"
          },

          body:JSON.stringify({
            score:score
          })

        }

      );


      if(!update.ok){

        console.log(
          "Leaderboard update failed:",
          await update.text()
        );

      }

      return;
    }


    /*
      First score for this player this week.
    */

    let insert=await fetch(

      SUPABASE_URL+
      "/rest/v1/leaderboard",

      {

        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+SUPABASE_KEY,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=minimal"
        },

        body:JSON.stringify({

          name:playerName,

          score:score,

          week_start:weekStart

        })

      }

    );


    if(!insert.ok){

      console.log(
        "Leaderboard insert failed:",
        await insert.text()
      );

    }

  }catch(e){

    console.log(
      "Leaderboard error:",
      e
    );

  }
}


/* =========================================================
   LOAD LEADERBOARD
   ALSO DEDUPLICATES OLD DUPLICATE ENTRIES
   ========================================================= */

async function loadLeaderboard(){

  try{

    let weekStart=getWeekStart();


    let res=await fetch(

      SUPABASE_URL+
      "/rest/v1/leaderboard?week_start=eq."+
      weekStart+
      "&select=name,score&order=score.desc",

      {

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+SUPABASE_KEY
        }

      }

    );


    let data=await res.json();


    if(!res.ok){

      leaderboardList.textContent=
        "Error "+res.status;

      console.log(data);

      return;
    }


    /*
      Group players by name.
      This also cleans up duplicate names
      that were already stored previously.
    */

    let players={};


    data.forEach(row=>{

      let key=
        String(row.name)
        .trim()
        .toLowerCase();


      if(
        !players[key] ||
        Number(row.score)>
        Number(players[key].score)
      ){

        players[key]={
          name:row.name,
          score:Number(row.score)
        };

      }

    });


    let top10=
      Object.values(players)
      .sort(
        (a,b)=>b.score-a.score
      )
      .slice(0,10);


    if(top10.length===0){

      leaderboardList.textContent=
        "No scores yet";

      return;
    }


    leaderboardList.innerHTML=
      top10.map(
        (x,i)=>
          `<div>${i+1}. ${escapeHtml(x.name)} — ${x.score}</div>`
      ).join("");


  }catch(e){

    leaderboardList.textContent=
      "Leaderboard unavailable";

    console.log(
      "Leaderboard error:",
      e
    );

  }
}


/* =========================================================
   SECURITY FOR PLAYER NAMES
   ========================================================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   GAME OVER
   ========================================================= */

async function gameOver(){

  if(!running){
    return;
  }

  running=false;


  finalScore.textContent=
    score;


  document.getElementById(
    "gameOverText"
  ).textContent=
    "You hit an obstacle!";


  gameOverPanel
    .classList
    .remove("hidden");


  await saveScore();


  loadLeaderboard();

}


/* =========================================================
   START GAME
   ========================================================= */

function start(){

  playerName=
    (
      nameInput.value.trim()
      ||
      "Player"
    ).slice(0,16);


  localStorage.setItem(
    "wildRunnerName",
    playerName
  );


  score=0;

  speed=330;

  spawnTimer=0;

  appleTimer=.4;


  obstacles=[];

  apples=[];


  player.x=
    W*.23;

  player.y=
    groundY-player.h;

  player.vy=0;

  player.onGround=true;


  scoreEl.textContent=
    0;


  startPanel
    .classList
    .add("hidden");


  gameOverPanel
    .classList
    .add("hidden");


  running=true;


  audioStart();


  last=
    performance.now();


  requestAnimationFrame(
    loop
  );
}


/* =========================================================
   UPDATE GAME
   ========================================================= */

function update(dt){

  speed+=dt*4;


  player.vy+=1900*dt;

  player.y+=
    player.vy*dt;


  if(
    player.y>=
    groundY-player.h
  ){

    player.y=
      groundY-player.h;

    player.vy=0;

    player.onGround=true;

  }


  spawnTimer-=dt;

  appleTimer-=dt;


  if(spawnTimer<=0){

    spawnObstacle();


    spawnTimer=
      Math.max(
        .72,
        1.25-
        Math.min(score,40)*.012
      )
      +
      Math.random()*.35;

  }


  if(appleTimer<=0){

    spawnApple();

    appleTimer=
      .65+
      Math.random()*.7;

  }


  obstacles.forEach(o=>{

    o.x-=
      speed*dt;

  });


  apples.forEach(a=>{

    a.x-=
      speed*dt;

  });


  for(
    let i=obstacles.length-1;
    i>=0;
    i--
  ){

    if(
      obstacles[i].x+
      obstacles[i].w
      <-50
    ){

      obstacles.splice(i,1);

    }else if(
      collide(
        player,
        obstacles[i]
      )
    ){

      gameOver();

      return;
    }

  }


  for(
    let i=apples.length-1;
    i>=0;
    i--
  ){

    if(
      apples[i].x
      <-30
    ){

      apples.splice(i,1);

    }else if(
      collect(apples[i])
    ){

      score++;

      scoreEl.textContent=
        score;


      beep(
        900,
        .08,
        "sine",
        .08
      );


      setTimeout(()=>{

        beep(
          1200,
          .1,
          "sine",
          .06
        );

      },60);


      apples.splice(i,1);

    }

  }
}


/* =========================================================
   DRAW
   ========================================================= */

function draw(){

  background();

  apples.forEach(
    appleDraw
  );

  obstacles.forEach(
    obstacleDraw
  );

  playerDraw();

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(t){

  if(!running){
    return;
  }


  let dt=
    Math.min(
      (t-last)/1000,
      .035
    );


  last=t;


  update(dt);

  draw();


  if(running){

    requestAnimationFrame(
      loop
    );

  }
}


/* =========================================================
   TOUCH CONTROLS
   ========================================================= */

let sy=0;
let sx=0;


canvas.addEventListener(
  "touchstart",
  e=>{

    let t=
      e.changedTouches[0];

    sy=
      t.clientY;

    sx=
      t.clientX;

    e.preventDefault();

  },
  {
    passive:false
  }
);


canvas.addEventListener(
  "touchend",
  e=>{

    let t=
      e.changedTouches[0];

    let dy=
      sy-t.clientY;

    let dx=
      Math.abs(
        t.clientX-sx
      );


    if(
      dy>45 &&
      dy>dx*.7
    ){

      jump();

    }


    e.preventDefault();

  },
  {
    passive:false
  }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="ArrowUp" ||
      e.code==="Space"
    ){

      jump();

    }

  }
);


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById(
  "startBtn"
).onclick=start;


document.getElementById(
  "againBtn"
).onclick=start;


/* =========================================================
   SAVED NAME
   ========================================================= */

let saved=
  localStorage.getItem(
    "wildRunnerName"
  );


if(saved){

  nameInput.value=
    saved;

}


/* =========================================================
   SOUND
   ========================================================= */

function audioStart(){

  if(audioCtx){
    return;
  }


  try{

    audioCtx=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();


    audioCtx.resume();


  }catch(e){}

}


function beep(
  freq,
  duration,
  type,
  volume
){

  if(!audioCtx){
    return;
  }


  try{

    let osc=
      audioCtx.createOscillator();

    let gain=
      audioCtx.createGain();


    osc.type=type;

    osc.frequency.value=
      freq;


    gain.gain.value=
      volume;


    osc.connect(gain);

    gain.connect(
      audioCtx.destination
    );


    osc.start();


    gain.gain
      .exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+
        duration
      );


    osc.stop(
      audioCtx.currentTime+
      duration
    );


  }catch(e){}

}

   INITIAL LEADERBOARD LOAD

loadLeaderboard();

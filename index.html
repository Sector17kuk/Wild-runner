<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Wild Runner</title>

<style>

*{

  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;

}

html,body{

  margin:0;

  padding:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#111;

  font-family:Arial,sans-serif;

}

#game{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#72cfff;

}

canvas{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  touch-action:none;

}

#hud{

  position:absolute;

  top:12px;

  left:12px;

  right:12px;

  display:flex;

  justify-content:space-between;

  color:white;

  font-size:21px;

  font-weight:bold;

  text-shadow:2px 2px 3px #000;

  z-index:5;

}

#leaderboard{

  position:absolute;

  top:52px;

  left:10px;

  right:10px;

  max-width:420px;

  margin:auto;

  padding:10px 12px;

  border-radius:12px;

  background:rgba(0,0,0,.72);

  color:white;

  z-index:6;

}

#leaderboardTitle{

  font-size:16px;

  font-weight:bold;

  margin-bottom:5px;

}

.row{

  display:flex;

  justify-content:space-between;

  padding:2px 0;

  font-size:14px;

}

.panel{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  background:rgba(0,0,0,.45);

  padding:20px;

  z-index:10;

}

.hidden{

  display:none!important;

}

.card{

  width:100%;

  max-width:380px;

  background:white;

  border-radius:20px;

  padding:25px;

  text-align:center;

}

.card h1{

  margin:0 0 10px;

  font-size:32px;

}

input{

  width:100%;

  padding:14px;

  font-size:18px;

  border:2px solid #ccc;

  border-radius:10px;

  outline:none;

}

button{

  width:100%;

  margin-top:12px;

  padding:14px;

  border:0;

  border-radius:10px;

  background:#168b35;

  color:white;

  font-size:18px;

  font-weight:bold;

}

.small{

  font-size:14px;

  color:#666;

}

#hint{

  position:absolute;

  bottom:15px;

  left:0;

  right:0;

  text-align:center;

  color:white;

  font-weight:bold;

  text-shadow:2px 2px 3px #000;

  z-index:5;

}

</style>

</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div>🍎 <span id="score">0</span></div>

  <div>🏃 RUNNER</div>

</div>

<div id="leaderboard">

  <div id="leaderboardTitle">

    🏆 WEEKLY TOP 10

  </div>

  <div id="leaderboardList">

    Loading...

  </div>

</div>

<div id="startPanel" class="panel">

  <div class="card">

    <h1>🌿 WILD RUNNER</h1>

    <p>

      Run, jump over obstacles and collect apples!

    </p>

    <input

      id="nameInput"

      maxlength="16"

      placeholder="Enter your name"

      autocomplete="off"

    >

    <button id="startBtn">

      START RUN

    </button>

    <p class="small">

      Swipe ↑ to jump

    </p>

  </div>

</div>

<div id="gameOverPanel" class="panel hidden">

  <div class="card">

    <h2>💥 GAME OVER</h2>

    <h2>

      Score: <span id="finalScore">0</span>

    </h2>

    <button id="againBtn">

      RUN AGAIN

    </button>

  </div>

</div>

<div id="hint">

  SWIPE UP ↑ TO JUMP

</div>

</div>

<script>

/* =====================================================

   SUPABASE

   ===================================================== */

const SUPABASE_URL =

"https://ryecmnwbdlxvjigxgfml.supabase.co";

/*

   KEEP YOUR EXISTING SUPABASE_KEY LINE HERE.

   DO NOT use your database password.

   DO NOT use a service-role key.

   Use the same anon key already present in

   your current index.html.

*/

const SUPABASE_KEY = "YOUR_EXISTING_ANON_KEY";

/* =====================================================

   ELEMENTS

   ===================================================== */

const canvas =

document.getElementById("canvas");

const ctx =

canvas.getContext("2d");

const scoreEl =

document.getElementById("score");

const nameInput =

document.getElementById("nameInput");

const startPanel =

document.getElementById("startPanel");

const gameOverPanel =

document.getElementById("gameOverPanel");

const finalScore =

document.getElementById("finalScore");

const leaderboardList =

document.getElementById("leaderboardList");

/* =====================================================

   GAME

   ===================================================== */

let W=0;

let H=0;

let groundY=0;

let running=false;

let score=0;

let playerName="";

let speed=5;

let obstacleTimer=0;

let appleTimer=0;

let obstacles=[];

let apples=[];

const player={

  x:80,

  y:0,

  w:42,

  h:65,

  vy:0,

  onGround:true

};

/* =====================================================

   RESIZE

   ===================================================== */

function resize(){

  W=window.innerWidth;

  H=window.innerHeight;

  canvas.width=W;

  canvas.height=H;

  groundY=H-100;

  if(!running){

    player.y=

      groundY-player.h;

  }

}

window.addEventListener(

  "resize",

  resize

);

resize();

/* =====================================================

   WEEK START

   ===================================================== */

function getWeekStart(){

  const d=new Date();

  const day=d.getDay();

  const diff=

    day===0 ? -6 : 1-day;

  const monday=new Date(d);

  monday.setDate(

    d.getDate()+diff

  );

  const y=

    monday.getFullYear();

  const m=

    String(

      monday.getMonth()+1

    ).padStart(2,"0");

  const dayNumber=

    String(

      monday.getDate()

    ).padStart(2,"0");

  return y+"-"+m+"-"+dayNumber;

}

/* =====================================================

   SAVE PERSONAL BEST

   ===================================================== */

async function saveScore(){

  if(

    !playerName ||

    score<=0

  ){

    return;

  }

  try{

    const week=

      getWeekStart();

    const name=

      encodeURIComponent(

        playerName.trim()

      );

    /*

      Find existing score for this name.

    */

    const findResponse=

      await fetch(

        SUPABASE_URL+

        "/rest/v1/leaderboard"+

        "?name=eq."+name+

        "&week_start=eq."+week+

        "&select=id,score",

        {

          headers:{

            "apikey":

              SUPABASE_KEY,

            "Authorization":

              "Bearer "+

              SUPABASE_KEY

          }

        }

      );

    if(!findResponse.ok){

      console.log(

        "Could not check score:",

        findResponse.status

      );

      return;

    }

    const rows=

      await findResponse.json();

    /*

      Existing name:

      20 → 7

      Do nothing.

      20 → 25

      Update to 25.

    */

    if(rows.length>0){

      let bestRow=rows[0];

      for(

        const row of rows

      ){

        if(

          Number(row.score)>

          Number(bestRow.score)

        ){

          bestRow=row;

        }

      }

      if(

        score<=Number(bestRow.score)

      ){

        return;

      }

      await fetch(

        SUPABASE_URL+

        "/rest/v1/leaderboard"+

        "?id=eq."+bestRow.id,

        {

          method:"PATCH",

          headers:{

            "apikey":

              SUPABASE_KEY,

            "Authorization":

              "Bearer "+

              SUPABASE_KEY,

            "Content-Type":

              "application/json",

            "Prefer":

              "return=minimal"

          },

          body:JSON.stringify({

            score:score

          })

        }

      );

      return;

    }

    /*

      First score for this name.

    */

    await fetch(

      SUPABASE_URL+

      "/rest/v1/leaderboard",

      {

        method:"POST",

        headers:{

          "apikey":

            SUPABASE_KEY,

          "Authorization":

            "Bearer "+

            SUPABASE_KEY,

          "Content-Type":

            "application/json",

          "Prefer":

            "return=minimal"

        },

        body:JSON.stringify({

          name:

            playerName.trim(),

          score:

            score,

          week_start:

            week

        })

      }

    );

  }catch(error){

    console.log(

      "Save score error:",

      error

    );

  }

}

/* =====================================================

   LEADERBOARD

   ===================================================== */

async function loadLeaderboard(){

  try{

    const week=

      getWeekStart();

    const response=

      await fetch(

        SUPABASE_URL+

        "/rest/v1/leaderboard"+

        "?week_start=eq."+week+

        "&select=name,score"+

        "&order=score.desc",

        {

          headers:{

            "apikey":

              SUPABASE_KEY,

            "Authorization":

              "Bearer "+

              SUPABASE_KEY

          }

        }

      );

    if(!response.ok){

      leaderboardList.textContent=

        "Leaderboard unavailable";

      return;

    }

    const data=

      await response.json();

    /*

      Remove duplicate names.

      If database contains:

      Ravi 20

      Ravi 7

      Ravi 5

      display:

      Ravi 20

    */

    const best={};

    for(

      const row of data

    ){

      const originalName=

        String(

          row.name||""

        ).trim();

      const key=

        originalName.toLowerCase();

      const value=

        Number(row.score)||0;

      if(!key){

        continue;

      }

      if(

        !best[key] ||

        value>best[key].score

      ){

        best[key]={

          name:originalName,

          score:value

        };

      }

    }

    const top=

      Object.values(best)

      .sort(

        (a,b)=>

          b.score-a.score

      )

      .slice(0,10);

    if(top.length===0){

      leaderboardList.textContent=

        "No scores yet";

      return;

    }

    leaderboardList.innerHTML=

      top.map(

        (row,index)=>`

          <div class="row">

            <span>

              ${index+1}. ${escapeHTML(row.name)}

            </span>

            <b>

              ${row.score}

            </b>

          </div>

        `

      ).join("");

  }catch(error){

    console.log(

      "Leaderboard error:",

      error

    );

    leaderboardList.textContent=

      "Leaderboard unavailable";

  }

}

function escapeHTML(text){

  return text

    .replace(

      /&/g,

      "&amp;"

    )

    .replace(

      /</g,

      "&lt;"

    )

    .replace(

      />/g,

      "&gt;"

    )

    .replace(

      /"/g,

      "&quot;"

    )

    .replace(

      /'/g,

      "&#039;"

    );

}

/* =====================================================

   START

   ===================================================== */

function start(){

  playerName=

    nameInput.value

    .trim()

    .slice(0,16);

  if(!playerName){

    nameInput.focus();

    return;

  }

  score=0;

  speed=5;

  obstacleTimer=60;

  appleTimer=80;

  obstacles=[];

  apples=[];

  player.x=80;

  player.y=

    groundY-player.h;

  player.vy=0;

  player.onGround=true;

  scoreEl.textContent="0";

  startPanel

    .classList.add("hidden");

  gameOverPanel

    .classList.add("hidden");

  running=true;

}

/* =====================================================

   GAME OVER

   ===================================================== */

function gameOver(){

  if(!running){

    return;

  }

  running=false;

  finalScore.textContent=

    score;

  gameOverPanel

    .classList.remove("hidden");

  saveScore();

  setTimeout(

    loadLeaderboard,

    500

  );

}

/* =====================================================

   JUMP

   ===================================================== */

function jump(){

  if(

    !running ||

    !player.onGround

  ){

    return;

  }

  player.vy=-14;

  player.onGround=false;

}

/* =====================================================

   TOUCH

   ===================================================== */

let touchStartY=0;

canvas.addEventListener(

  "touchstart",

  function(e){

    touchStartY=

      e.touches[0].clientY;

  },

  {passive:true}

);

canvas.addEventListener(

  "touchend",

  function(e){

    const endY=

      e.changedTouches[0].clientY;

    if(

      touchStartY-endY>30

    ){

      jump();

    }

  },

  {passive:true}

);

/* =====================================================

   KEYBOARD

   ===================================================== */

document.addEventListener(

  "keydown",

  function(e){

    if(

      e.code==="ArrowUp" ||

      e.code==="Space"

    ){

      e.preventDefault();

      jump();

    }

  }

);

/* =====================================================

   OBSTACLES

   ===================================================== */

function createObstacle(){

  const types=[

    "log",

    "rock",

    "bush",

    "tree"

  ];

  const type=

    types[

      Math.floor(

        Math.random()*

        types.length

      )

    ];

  let w=55;

  let h=40;

  if(type==="tree"){

    w=65;

    h=50;

  }

  if(type==="bush"){

    w=60;

    h=42;

  }

  if(type==="rock"){

    w=52;

    h=35;

  }

  obstacles.push({

    x:W+30,

    y:groundY-h,

    w:w,

    h:h,

    type:type

  });

}

/* =====================================================

   APPLES

   ===================================================== */

function createApple(){

  apples.push({

    x:W+30,

    y:

      groundY-

      80-

      Math.random()*90,

    r:12

  });

}

/* =====================================================

   COLLISION

   ===================================================== */

function collision(a,b){

  return(

    a.x+6<

      b.x+b.w &&

    a.x+a.w-6>

      b.x &&

    a.y+8<

      b.y+b.h &&

    a.y+a.h-4>

      b.y

  );

}

/* =====================================================

   UPDATE

   ===================================================== */

function update(){

  if(!running){

    return;

  }

  /* PLAYER */

  player.vy+=0.7;

  player.y+=player.vy;

  if(

    player.y>=

    groundY-player.h

  ){

    player.y=

      groundY-player.h;

    player.vy=0;

    player.onGround=true;

  }

  /* SPEED */

  speed+=0.001;

  /* OBSTACLE */

  obstacleTimer--;

  if(obstacleTimer<=0){

    createObstacle();

    obstacleTimer=

      70+

      Math.random()*60;

  }

  obstacles.forEach(

    o=>{

      o.x-=speed;

    }

  );

  obstacles=

    obstacles.filter(

      o=>o.x>-100

    );

  /* APPLE */

  appleTimer--;

  if(appleTimer<=0){

    createApple();

    appleTimer=

      70+

      Math.random()*80;

  }

  apples.forEach(

    a=>{

      a.x-=speed;

    }

  );

  apples=

    apples.filter(

      a=>a.x>-50

    );

  /* HIT OBSTACLE */

  for(

    const obstacle of obstacles

  ){

    if(

      collision(

        player,

        obstacle

      )

    ){

      gameOver();

      return;

    }

  }

  /* COLLECT APPLE */

  for(

    let i=apples.length-1;

    i>=0;

    i--

  ){

    const apple=

      apples[i];

    const box={

      x:

        apple.x-

        apple.r,

      y:

        apple.y-

        apple.r,

      w:

        apple.r*2,

      h:

        apple.r*2

    };

    if(

      collision(

        player,

        box

      )

    ){

      score++;

      scoreEl.textContent=

        score;

      apples.splice(i,1);

    }

  }

}

/* =====================================================

   DRAW

   ===================================================== */

function draw(){

  /* SKY */

  ctx.fillStyle=

    "#78d5ff";

  ctx.fillRect(

    0,

    0,

    W,

    H

  );

  /* CLOUD */

  ctx.fillStyle=

    "rgba(255,255,255,.75)";

  ctx.beginPath();

  ctx.arc(

    100,

    100,

    28,

    0,

    Math.PI*2

  );

  ctx.arc(

    135,

    100,

    38,

    0,

    Math.PI*2

  );

  ctx.arc(

    175,

    105,

    24,

    0,

    Math.PI*2

  );

  ctx.fill();

  /* GROUND */

  ctx.fillStyle=

    "#58a947";

  ctx.fillRect(

    0,

    groundY,

    W,

    H-groundY

  );

  ctx.fillStyle=

    "#315e29";

  ctx.fillRect(

    0,

    groundY,

    W,

    7

  );

  /* PLAYER */

  ctx.font=

    "55px Arial";

  ctx.fillText(

    "🏃",

    player.x,

    player.y+player.h

  );

  /* OBSTACLES */

  obstacles.forEach(

    o=>{

      ctx.font=

        "42px Arial";

      let emoji="🌿";

      if(o.type==="log")

        emoji="🪵";

      if(o.type==="rock")

        emoji="🪨";

      if(o.type==="bush")

        emoji="🌿";

      if(o.type==="tree")

        emoji="🌳";

      ctx.fillText(

        emoji,

        o.x,

        o.y+o.h

      );

    }

  );

  /* APPLES */

  ctx.font=

    "28px Arial";

  apples.forEach(

    a=>{

      ctx.fillText(

        "🍎",

        a.x-14,

        a.y+10

      );

    }

  );

}

/* =====================================================

   MAIN LOOP

   ===================================================== */

function loop(){

  update();

  draw();

  requestAnimationFrame(

    loop

  );

}

/* =====================================================

   BUTTONS

   ===================================================== */

document

  .getElementById("startBtn")

  .addEventListener(

    "click",

    start

  );

document

  .getElementById("againBtn")

  .addEventListener(

    "click",

    function(){

      gameOverPanel

        .classList.add("hidden");

      startPanel

        .classList.remove("hidden");

    }

  );

/* =====================================================

   LEADERBOARD

   ===================================================== */

loadLeaderboard();

setInterval(

  loadLeaderboard,

  3000

);

/* =====================================================

   START

   ===================================================== */

loop();

</script>

</body>

</html>
